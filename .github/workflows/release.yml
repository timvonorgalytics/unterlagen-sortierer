name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          pip install playwright pillow reportlab pypdf
          python -m playwright install --with-deps chromium
      - name: Release-ZIP bauen (führt alle Tests aus)
        run: bash tools/release_bauen.sh
      - name: GitHub-Release mit ZIP anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Unterlagen-Sortierer $GITHUB_REF_NAME" \
            --notes "Auslieferungs-ZIP: entpacken und per Doppelklick starten (Windows: .bat, macOS: .command). Details im CHANGELOG.md."
